[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foldchrono"
version = "0.1.0"
description = "Local-first directory time capsule: snapshot, diff, and restore any folder — no git required."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "FoldChrono Contributors"}]
keywords = ["backup", "snapshot", "time-machine", "version-control", "local-first", "deduplication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
]

[project.scripts]
foldchrono = "foldchrono.cli:main"

[tool.setuptools.packages.find]
include = ["foldchrono*"]
